# Specs only. Evals call a real model, cost money and vary run to run, so
# they are run on purpose and never here.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  specs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - run: bundle exec rspec
